# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Alex Korovyansky
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: true
  analytics:
    provider: null
  locale: en-US
  baseUrl: alexkorovyansky.com
  ignorePatterns:
    - ".obsidian/**"
    - ".quartz/**"
    - .gitignore
    - LICENSE
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    defaultMode: dark
    typography:
      header: Inter
      body: Inter
      code: Fira Code
    colors:
      lightMode:
        light: "#f5efe6"
        lightgray: "#e4dccf"
        gray: "#b8ab99"
        darkgray: "#6e6359"
        dark: "#3a332e"
        secondary: "#a8896f"
        tertiary: "#c4a892"
        highlight: rgba(196, 168, 146, 0.15)
        textHighlight: "#d4a86a88"
      darkMode:
        light: "#1c1917"
        lightgray: "#4a423d"
        gray: "#6e6359"
        darkgray: "#d4b8a2"
        dark: "#e8e1d7"
        secondary: "#c4a892"
        tertiary: "#d4a86a"
        highlight: rgba(196, 168, 146, 0.15)
        textHighlight: "#d4b8a288"
plugins:
  - source: github:quartz-community/created-modified-date
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: github:quartz-community/citations
    enabled: false
    order: 85
  - source: github:quartz-community/hard-line-breaks
    enabled: false
    order: 90
  - source: github:quartz-community/ox-hugo
    enabled: false
    order: 91
  - source: github:quartz-community/roam
    enabled: false
    order: 92
  - source: github:quartz-community/fonts
    enabled: true
  - source: github:quartz-community/remove-draft
    enabled: false
  - source: github:quartz-community/explicit-publish
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/og-image
    enabled: true
  - source: github:quartz-community/cname
    enabled: false
  - source: github:quartz-community/canvas-page
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/tag-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    options:
      title: Alex Korovyansky
      folderClickBehavior: link
      folderDefaultState: open
      useSavedState: true
      # Explorer hides the root index.md by default. This adds it to the tree, named after its first heading,
      # points its link at the site root instead of /index once the tree renders,
      # hides the "by direct link" folder, and shows every name in the tree in lowercase.
      mapFn: |-
        (node) => {
          if (node.slugSegments.length === 0 && node.data) {
            node.children = node.children.filter((c) => c.slugSegment !== 'by-direct-link');
            node.makeChild(['index'], node.data).displayName = node.data.content.split('\n')[0];
            setTimeout(() => document.querySelectorAll(`.explorer a[href$='/index']`).forEach((a) => a.setAttribute('href', a.getAttribute('href').slice(0, -5))), 0);
          }
          node.displayName = node.displayName.toLowerCase();
        }
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/graph
    enabled: false
    layout:
      position: right
      priority: 10
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/backlinks
    enabled: false
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/content-meta
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: github:quartz-community/tag-list
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/reader-mode
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: github:quartz-community/comments
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: github:quartz-community/footer
    enabled: true
    options:
      links:
        Email: mailto:inbox@alexkorovyansky.com
        LinkedIn: https://www.linkedin.com/in/alexkorovyansky
        X: https://x.com/alexkorovyansky
  - source: github:quartz-community/recent-notes
    enabled: false
  - source: github:quartz-community/spacer
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: github:quartz-community/bases-page
    enabled: true
    options: {}
    order: 50
  - source: github:quartz-community/note-properties
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: github:quartz-community/unlisted-pages
    enabled: true
    options: {}
    order: 45
  - source: github:AlexKorovyansky/quartz-noindex
    enabled: true
    options: {}
    order: 46
  - source: github:AlexKorovyansky/quartz-mobile-drawer
    enabled: true
    options:
      title: Navigation
      edgeWidth: 3.5rem
    order: 47
  - source: github:AlexKorovyansky/quartz-theme-color
    enabled: true
    options: {}
    order: 48
  - source: github:quartz-community/encrypted-pages
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
    layout:
      position: body
      priority: 100
      display: all
  - source: github:quartz-community/stacked-pages
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: github:alexkorovyansky/quartz-themes-lightweight
    enabled: true
    options:
      theme: "oxygen"
      mode: both
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - content-meta
      positions:
        right: []
    tag:
      exclude:
        - content-meta
      positions:
        right: []
    canvas: {}
    bases: {}
